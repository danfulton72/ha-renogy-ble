name: Migrate test domain imports

on:
  push:
    branches:
      - fix/bt-th-riv-inverter-detection

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/bt-th-riv-inverter-detection
      - name: Update stale test package references
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('tests').rglob('*.py'):
              text = path.read_text()
              updated = text.replace('custom_components.renogy', 'custom_components.renogy_ble')
              updated = updated.replace('/ "renogy")', '/ "renogy_ble")')
              updated = updated.replace("/ 'renogy')", "/ 'renogy_ble')")
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          print('Updated:', *changed, sep='\n  ')
          PY
      - name: Remove one-shot migration workflow
        run: rm .github/workflows/migrate-test-domain.yml
      - name: Commit migrated tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/migrate-test-domain.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'test: migrate imports to renogy_ble domain'
          git push origin HEAD:fix/bt-th-riv-inverter-detection
