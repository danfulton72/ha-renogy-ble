name: Fix PR6 test expectations

on:
  push:
    branches:
      - fix/bt-th-riv-inverter-detection

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/bt-th-riv-inverter-detection
      - name: Apply targeted CI fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          init = Path('custom_components/renogy_ble/__init__.py')
          text = init.read_text()
          text = text.replace(
              '    if not isinstance(coordinator.data, dict):\n        return\n\n    model = coordinator.data.get("model")',
              '    data = getattr(coordinator, "data", None)\n    if not isinstance(data, dict):\n        return\n\n    model = data.get("model")',
          )
          init.write_text(text)

          for filename, anchor in (
              ('number.py', '    CONF_DEVICE_NAME,\n'),
              ('select.py', '    ATTR_MANUFACTURER,\n'),
              ('switch.py', '    ATTR_MANUFACTURER,\n'),
          ):
              path = Path('custom_components/renogy_ble') / filename
              text = path.read_text()
              if '    CONF_DEVICE_TYPE,\n' not in text:
                  text = text.replace(anchor, anchor + '    CONF_DEVICE_TYPE,\n', 1)
              text = text.replace(
                  '    device_type = coordinator.device_type\n',
                  '    configured_device_type = config_entry.data.get(\n'
                  '        CONF_DEVICE_TYPE, DEFAULT_DEVICE_TYPE\n'
                  '    )\n'
                  '    device_type = getattr(coordinator, "device_type", configured_device_type)\n'
                  '    if not isinstance(device_type, str):\n'
                  '        device_type = configured_device_type\n',
                  1,
              )
              path.write_text(text)

          for path in Path('tests').rglob('*.py'):
              text = path.read_text()
              updated = text.replace('custom_components/renogy/', 'custom_components/renogy_ble/')
              updated = updated.replace('/ "renogy"', '/ "renogy_ble"')
              updated = updated.replace("/ 'renogy'", "/ 'renogy_ble'")
              updated = updated.replace(
                  '("renogy", "F0:F8:F2:57:47:0D:hub:33")',
                  '("renogy_ble", "F0:F8:F2:57:47:0D:hub:33")',
              )
              updated = updated.replace(
                  'assert module.DOMAIN == "renogy"',
                  'assert module.DOMAIN == "renogy_ble"',
              )
              if updated != text:
                  path.write_text(updated)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-pr6-tests.yml
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components tests .github/workflows/fix-pr6-tests.yml
          git commit -m 'test: align suite with renogy_ble domain and resolved types'
          git push origin HEAD:fix/bt-th-riv-inverter-detection
