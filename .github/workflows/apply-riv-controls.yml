name: Apply RIV inverter controls

on:
  push:
    branches:
      - feat/riv-inverter-controls

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/riv-inverter-controls
      - name: Apply RIV inverter control changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          # Constants/registers confirmed from the Android HCI capture.
          replace(
              "custom_components/renogy_ble/const.py",
              '''RENOGY_REGO_INVERTER_PREFIX = "BTRIC"\nRENOGY_BATTERY_PRO_PREFIXES = ("RNGRBP", "RNGC", "RNGPRO")''',
              '''RENOGY_REGO_INVERTER_PREFIX = "BTRIC"\nRIV_INVERTER_MODEL_PREFIX = "RIV"\nRENOGY_BATTERY_PRO_PREFIXES = ("RNGRBP", "RNGC", "RNGPRO")''',
          )
          replace(
              "custom_components/renogy_ble/const.py",
              '''class InverterRegister:\n    """Modbus registers for REGO-series inverter settings."""\n\n    CHARGE_CURRENT = 0x1146\n    LOW_VOLTAGE_WARN = 0x114E\n    BATTERY_OVER_VOLTAGE = 0x1164\n    AC_INPUT_CURRENT_LIMIT = 0x1168''',
              '''class InverterRegister:\n    """Modbus registers for supported inverter settings."""\n\n    # Shared/REGO settings.\n    CHARGE_CURRENT = 0x1146\n    LOW_VOLTAGE_WARN = 0x114E\n    BATTERY_OVER_VOLTAGE = 0x1164\n    AC_INPUT_CURRENT_LIMIT = 0x1168\n\n    # RIV-series settings confirmed from Renogy app BLE captures.\n    BEEP = 0x1005\n    OUTPUT = 0x1006\n    EQUALIZATION_VOLTAGE = 0x1149\n    BOOST_VOLTAGE = 0x114A\n    FLOAT_VOLTAGE = 0x114B\n    OVERDISCHARGE_SHUTDOWN = 0x114F\n    OUTPUT_PRIORITY = 0x1159\n    OVERVOLTAGE_RECOVERY = 0x1165\n    UNDERVOLTAGE_RECOVERY = 0x1166\n    LITHIUM_ACTIVATION = 0x1169''',
          )

          # RIV number entities.
          replace(
              "custom_components/renogy_ble/number.py",
              '''    RENOGY_REGO_INVERTER_PREFIX,\n    DCCRegister,''',
              '''    RENOGY_REGO_INVERTER_PREFIX,\n    RIV_INVERTER_MODEL_PREFIX,\n    DCCRegister,''',
          )
          marker = '''INVERTER_ALL_NUMBERS: tuple[RenogyNumberEntityDescription, ...] = ('''
          p = Path("custom_components/renogy_ble/number.py")
          text = p.read_text()
          insert_at = text.index("\n\n\nasync def async_setup_entry", text.index(marker))
          riv_numbers = r'''

# RIV-series settings confirmed from RIV1230PCH-23S Renogy app BLE captures.
RIV_INVERTER_NUMBERS: tuple[RenogyNumberEntityDescription, ...] = (
    RenogyNumberEntityDescription(
        key="inverter_charge_current",
        name="Charge Current",
        native_unit_of_measurement=UnitOfElectricCurrent.AMPERE,
        device_class=NumberDeviceClass.CURRENT,
        native_min_value=30.0,
        native_max_value=120.0,
        native_step=5.0,
        mode=NumberMode.BOX,
        entity_category=EntityCategory.CONFIG,
        register=InverterRegister.CHARGE_CURRENT,
        scale=10.0,
    ),
    RenogyNumberEntityDescription(
        key="inverter_equalization_voltage",
        name="Equalization Voltage",
        native_unit_of_measurement=UnitOfElectricPotential.VOLT,
        device_class=NumberDeviceClass.VOLTAGE,
        native_min_value=9.0,
        native_max_value=15.5,
        native_step=0.1,
        mode=NumberMode.BOX,
        entity_category=EntityCategory.CONFIG,
        register=InverterRegister.EQUALIZATION_VOLTAGE,
        scale=10.0,
    ),
    RenogyNumberEntityDescription(
        key="inverter_boost_voltage",
        name="Boost Voltage",
        native_unit_of_measurement=UnitOfElectricPotential.VOLT,
        device_class=NumberDeviceClass.VOLTAGE,
        native_min_value=9.0,
        native_max_value=15.5,
        native_step=0.1,
        mode=NumberMode.BOX,
        entity_category=EntityCategory.CONFIG,
        register=InverterRegister.BOOST_VOLTAGE,
        scale=10.0,
    ),
    RenogyNumberEntityDescription(
        key="inverter_float_voltage",
        name="Float Voltage",
        native_unit_of_measurement=UnitOfElectricPotential.VOLT,
        device_class=NumberDeviceClass.VOLTAGE,
        native_min_value=9.0,
        native_max_value=15.5,
        native_step=0.1,
        mode=NumberMode.BOX,
        entity_category=EntityCategory.CONFIG,
        register=InverterRegister.FLOAT_VOLTAGE,
        scale=10.0,
    ),
    RenogyNumberEntityDescription(
        key="inverter_low_voltage_warn",
        name="Low Voltage Warning",
        native_unit_of_measurement=UnitOfElectricPotential.VOLT,
        device_class=NumberDeviceClass.VOLTAGE,
        native_min_value=9.0,
        native_max_value=15.5,
        native_step=0.1,
        mode=NumberMode.BOX,
        entity_category=EntityCategory.CONFIG,
        register=InverterRegister.LOW_VOLTAGE_WARN,
        scale=10.0,
    ),
    RenogyNumberEntityDescription(
        key="inverter_overdischarge_shutdown",
        name="Overdischarge Shutdown",
        native_unit_of_measurement=UnitOfElectricPotential.VOLT,
        device_class=NumberDeviceClass.VOLTAGE,
        native_min_value=9.0,
        native_max_value=15.5,
        native_step=0.1,
        mode=NumberMode.BOX,
        entity_category=EntityCategory.CONFIG,
        register=InverterRegister.OVERDISCHARGE_SHUTDOWN,
        scale=10.0,
    ),
    RenogyNumberEntityDescription(
        key="inverter_over_voltage",
        name="Over Voltage Protection",
        native_unit_of_measurement=UnitOfElectricPotential.VOLT,
        device_class=NumberDeviceClass.VOLTAGE,
        native_min_value=9.0,
        native_max_value=16.0,
        native_step=0.1,
        mode=NumberMode.BOX,
        entity_category=EntityCategory.CONFIG,
        register=InverterRegister.BATTERY_OVER_VOLTAGE,
        scale=10.0,
    ),
    RenogyNumberEntityDescription(
        key="inverter_overvoltage_recovery",
        name="Overvoltage Recovery",
        native_unit_of_measurement=UnitOfElectricPotential.VOLT,
        device_class=NumberDeviceClass.VOLTAGE,
        native_min_value=9.0,
        native_max_value=15.5,
        native_step=0.1,
        mode=NumberMode.BOX,
        entity_category=EntityCategory.CONFIG,
        register=InverterRegister.OVERVOLTAGE_RECOVERY,
        scale=10.0,
    ),
    RenogyNumberEntityDescription(
        key="inverter_undervoltage_recovery",
        name="Undervoltage Recovery",
        native_unit_of_measurement=UnitOfElectricPotential.VOLT,
        device_class=NumberDeviceClass.VOLTAGE,
        native_min_value=9.0,
        native_max_value=16.0,
        native_step=0.1,
        mode=NumberMode.BOX,
        entity_category=EntityCategory.CONFIG,
        register=InverterRegister.UNDERVOLTAGE_RECOVERY,
        scale=10.0,
    ),
)
'''
          p.write_text(text[:insert_at] + riv_numbers + text[insert_at:])
          replace(
              "custom_components/renogy_ble/number.py",
              '''    if device_type == DeviceType.DCC.value:\n        descriptions = DCC_ALL_NUMBERS\n    elif device_type == DeviceType.INVERTER.value and str(\n        config_entry.data.get(CONF_DEVICE_NAME, "")\n    ).startswith(RENOGY_REGO_INVERTER_PREFIX):\n        descriptions = INVERTER_ALL_NUMBERS''',
              '''    model = ""\n    if coordinator.device and coordinator.device.parsed_data:\n        model = str(coordinator.device.parsed_data.get("model", ""))\n    elif isinstance(coordinator.data, dict):\n        model = str(coordinator.data.get("model", ""))\n\n    if device_type == DeviceType.DCC.value:\n        descriptions = DCC_ALL_NUMBERS\n    elif device_type == DeviceType.INVERTER.value and model.upper().startswith(\n        RIV_INVERTER_MODEL_PREFIX\n    ):\n        descriptions = RIV_INVERTER_NUMBERS\n    elif device_type == DeviceType.INVERTER.value and str(\n        config_entry.data.get(CONF_DEVICE_NAME, "")\n    ).startswith(RENOGY_REGO_INVERTER_PREFIX):\n        descriptions = INVERTER_ALL_NUMBERS''',
          )

          # RIV switches: Beep, Output, Lithium Activation.
          replace(
              "custom_components/renogy_ble/switch.py",
              '''    LOGGER,\n    DeviceType,''',
              '''    LOGGER,\n    RIV_INVERTER_MODEL_PREFIX,\n    DeviceType,\n    InverterRegister,''',
          )
          replace(
              "custom_components/renogy_ble/switch.py",
              '''class RenogyBLESwitchDescription(SwitchEntityDescription):\n    """Describes a Renogy BLE switch."""''',
              '''class RenogyBLESwitchDescription(SwitchEntityDescription):\n    """Describes a Renogy BLE switch."""\n\n    register: int = 0\n    on_value: int = 1\n    off_value: int = 0''',
          )
          replace(
              "custom_components/renogy_ble/switch.py",
              '''LOAD_SWITCH = RenogyBLESwitchDescription(\n    key=KEY_LOAD_STATUS,\n    name="DC Load",\n)''',
              '''LOAD_SWITCH = RenogyBLESwitchDescription(\n    key=KEY_LOAD_STATUS,\n    name="DC Load",\n)\n\nRIV_SWITCHES = (\n    RenogyBLESwitchDescription(\n        key="inverter_beep",\n        name="Beep",\n        register=InverterRegister.BEEP,\n        on_value=0,\n        off_value=1,\n    ),\n    RenogyBLESwitchDescription(\n        key="inverter_output",\n        name="Output",\n        register=InverterRegister.OUTPUT,\n        on_value=1,\n        off_value=2,\n    ),\n    RenogyBLESwitchDescription(\n        key="inverter_lithium_activation",\n        name="Lithium Activation",\n        register=InverterRegister.LITHIUM_ACTIVATION,\n        on_value=1,\n        off_value=0,\n    ),\n)''',
          )
          replace(
              "custom_components/renogy_ble/switch.py",
              '''    if device_type != DeviceType.CONTROLLER.value:\n        LOGGER.debug(\n            "Skipping load switch setup for non-controller device type: %s", device_type\n        )\n        return''',
              '''    if device_type == DeviceType.INVERTER.value:\n        model = ""\n        if coordinator.device and coordinator.device.parsed_data:\n            model = str(coordinator.device.parsed_data.get("model", ""))\n        elif isinstance(coordinator.data, dict):\n            model = str(coordinator.data.get("model", ""))\n        if model.upper().startswith(RIV_INVERTER_MODEL_PREFIX):\n            async_add_entities(\n                [RenogyRegisterSwitch(coordinator, coordinator.device, description) for description in RIV_SWITCHES]\n            )\n        return\n\n    if device_type != DeviceType.CONTROLLER.value:\n        LOGGER.debug(\n            "Skipping load switch setup for non-controller device type: %s", device_type\n        )\n        return''',
          )
          p = Path("custom_components/renogy_ble/switch.py")
          p.write_text(p.read_text() + r'''

class RenogyRegisterSwitch(SwitchEntity):
    """Writable RIV inverter switch backed by a single Modbus register."""

    _attr_has_entity_name = True

    def __init__(
        self,
        coordinator: RenogyActiveBluetoothCoordinator,
        device: Optional[RenogyBLEDevice],
        description: RenogyBLESwitchDescription,
    ) -> None:
        self.coordinator = coordinator
        self._device = device
        self.entity_description = description
        self._attr_is_on = None
        address = device.address if device else coordinator.address
        self._attr_unique_id = f"{address}_{description.key}"
        self._attr_name = cast("str | None", description.name)
        model = "Renogy RIV Inverter"
        name = "Renogy RIV Inverter"
        if device:
            name = device.name
            if device.parsed_data:
                model = str(device.parsed_data.get("model", model))
        self._attr_device_info = DeviceInfo(
            identifiers={(DOMAIN, address)},
            name=name,
            manufacturer=ATTR_MANUFACTURER,
            model=model,
        )

    @property
    def available(self) -> bool:
        return is_entity_available(self.coordinator, self._device)

    async def async_turn_on(self, **_kwargs: Any) -> None:
        await self._async_write_state(True)

    async def async_turn_off(self, **_kwargs: Any) -> None:
        await self._async_write_state(False)

    async def _async_write_state(self, state: bool) -> None:
        value = self.entity_description.on_value if state else self.entity_description.off_value
        if await self.coordinator.async_write_register(self.entity_description.register, value):
            self._attr_is_on = state
            self.async_write_ha_state()
''')

          # RIV output-priority select.
          replace(
              "custom_components/renogy_ble/select.py",
              '''    LOGGER,\n    DCCRegister,\n    DeviceType,''',
              '''    LOGGER,\n    RIV_INVERTER_MODEL_PREFIX,\n    DCCRegister,\n    DeviceType,\n    InverterRegister,''',
          )
          replace(
              "custom_components/renogy_ble/select.py",
              '''    # Only create select entities for DCC devices\n    if device_type != DeviceType.DCC.value:\n        LOGGER.debug(\n            "Skipping select entities for non-DCC device type: %s", device_type\n        )\n        return''',
              '''    if device_type == DeviceType.INVERTER.value:\n        model = ""\n        if coordinator.device and coordinator.device.parsed_data:\n            model = str(coordinator.device.parsed_data.get("model", ""))\n        elif isinstance(coordinator.data, dict):\n            model = str(coordinator.data.get("model", ""))\n        if model.upper().startswith(RIV_INVERTER_MODEL_PREFIX):\n            async_add_entities([RenogyOutputPrioritySelect(coordinator, coordinator.device)])\n        return\n\n    # Existing selects are DCC-only.\n    if device_type != DeviceType.DCC.value:\n        LOGGER.debug(\n            "Skipping select entities for non-DCC device type: %s", device_type\n        )\n        return''',
          )
          p = Path("custom_components/renogy_ble/select.py")
          p.write_text(p.read_text() + r'''

class RenogyOutputPrioritySelect(SelectEntity):
    """RIV inverter output-priority setting."""

    _attr_has_entity_name = True
    _attr_name = "Output Priority"
    _attr_options = ["Grid First", "Battery First"]

    _VALUES = {"Grid First": 1, "Battery First": 2}

    def __init__(
        self,
        coordinator: RenogyActiveBluetoothCoordinator,
        device: Optional[RenogyBLEDevice],
    ) -> None:
        self.coordinator = coordinator
        self._device = device
        self._attr_current_option = None
        address = device.address if device else coordinator.address
        self._attr_unique_id = f"{address}_inverter_output_priority"
        model = "Renogy RIV Inverter"
        name = "Renogy RIV Inverter"
        if device:
            name = device.name
            if device.parsed_data:
                model = str(device.parsed_data.get("model", model))
        self._attr_device_info = DeviceInfo(
            identifiers={(DOMAIN, address)},
            name=name,
            manufacturer=ATTR_MANUFACTURER,
            model=model,
        )

    @property
    def available(self) -> bool:
        return is_entity_available(self.coordinator, self._device)

    @property
    def current_option(self) -> str | None:
        return self._attr_current_option

    async def async_select_option(self, option: str) -> None:
        value = self._VALUES[option]
        if await self.coordinator.async_write_register(InverterRegister.OUTPUT_PRIORITY, value):
            self._attr_current_option = option
            self.async_write_ha_state()
''')

          # Regression tests pin the capture-derived register/value mappings and charge range.
          Path("tests/test_riv_inverter_controls.py").write_text(r'''"""Regression tests for RIV inverter controls."""

from custom_components.renogy_ble.const import InverterRegister
from custom_components.renogy_ble.number import RIV_INVERTER_NUMBERS
from custom_components.renogy_ble.select import RenogyOutputPrioritySelect
from custom_components.renogy_ble.switch import RIV_SWITCHES


def test_riv_register_map_matches_capture() -> None:
    assert InverterRegister.BEEP == 0x1005
    assert InverterRegister.OUTPUT == 0x1006
    assert InverterRegister.CHARGE_CURRENT == 0x1146
    assert InverterRegister.EQUALIZATION_VOLTAGE == 0x1149
    assert InverterRegister.BOOST_VOLTAGE == 0x114A
    assert InverterRegister.FLOAT_VOLTAGE == 0x114B
    assert InverterRegister.LOW_VOLTAGE_WARN == 0x114E
    assert InverterRegister.OVERDISCHARGE_SHUTDOWN == 0x114F
    assert InverterRegister.OUTPUT_PRIORITY == 0x1159
    assert InverterRegister.BATTERY_OVER_VOLTAGE == 0x1164
    assert InverterRegister.OVERVOLTAGE_RECOVERY == 0x1165
    assert InverterRegister.UNDERVOLTAGE_RECOVERY == 0x1166
    assert InverterRegister.LITHIUM_ACTIVATION == 0x1169


def test_riv_switch_encodings_match_capture() -> None:
    by_key = {item.key: item for item in RIV_SWITCHES}
    assert (by_key["inverter_beep"].on_value, by_key["inverter_beep"].off_value) == (0, 1)
    assert (by_key["inverter_output"].on_value, by_key["inverter_output"].off_value) == (1, 2)
    assert (
        by_key["inverter_lithium_activation"].on_value,
        by_key["inverter_lithium_activation"].off_value,
    ) == (1, 0)


def test_riv_output_priority_encodings_match_capture() -> None:
    assert RenogyOutputPrioritySelect._VALUES == {
        "Grid First": 1,
        "Battery First": 2,
    }


def test_riv_charge_current_range() -> None:
    charge = next(item for item in RIV_INVERTER_NUMBERS if item.key == "inverter_charge_current")
    assert charge.native_min_value == 30.0
    assert charge.native_max_value == 120.0
    assert charge.scale == 10.0
''')
          PY
      - name: Format and validate changed Python
        run: |
          python -m pip install ruff
          ruff format custom_components/renogy_ble tests/test_riv_inverter_controls.py
          ruff check custom_components/renogy_ble tests/test_riv_inverter_controls.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/renogy_ble tests/test_riv_inverter_controls.py
          git commit -m "feat: add RIV inverter controls"
          git push origin HEAD:feat/riv-inverter-controls
