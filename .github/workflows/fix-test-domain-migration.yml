name: Normalize test domain imports

on:
  push:
    branches:
      - fix/bt-th-riv-inverter-detection

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/bt-th-riv-inverter-detection
      - name: Normalize test package references
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('tests').rglob('*.py'):
              text = path.read_text()
              updated = text.replace('custom_components.renogy_ble_ble', 'custom_components.renogy_ble')
              if updated != text:
                  path.write_text(updated)

          Path('tests/conftest.py').write_text(
              '"""Test configuration for the Renogy BLE integration."""\n'
          )
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-test-domain-migration.yml
      - name: Commit normalized tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/fix-test-domain-migration.yml
          git commit -m 'test: normalize renogy_ble test imports'
          git push origin HEAD:fix/bt-th-riv-inverter-detection
