name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main with tags
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          # A rerun of a commit that is already contained in the latest release is a no-op.
          if [[ -n "${latest_tag}" ]] && git merge-base --is-ancestor HEAD "${latest_tag}"; then
            echo "already_released=true" >> "${GITHUB_OUTPUT}"
            echo "tag=${latest_tag}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "${latest_tag}" ]]; then
            # Bootstrap the independent repository from the imported manifest version.
            version="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/renogy/manifest.json').read_text())
          print(manifest['version'])
          PY
          )"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${version}"
            if [[ ! "${major}" =~ ^[0-9]+$ || ! "${minor}" =~ ^[0-9]+$ || ! "${patch}" =~ ^[0-9]+$ ]]; then
              echo "Latest release tag is not a supported SemVer tag: ${latest_tag}" >&2
              exit 1
            fi
            version="${major}.${minor}.$((patch + 1))"
          fi

          echo "already_released=false" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Synchronize manifest version
        if: steps.version.outputs.already_released != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('custom_components/renogy/manifest.json')
          manifest = json.loads(path.read_text())
          manifest['version'] = os.environ['VERSION']
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Commit synchronized version
        if: steps.version.outputs.already_released != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- custom_components/renogy/manifest.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/renogy/manifest.json
          git commit -m "chore(release): ${TAG}"
          git push origin HEAD:main

      - name: Create tag
        if: steps.version.outputs.already_released != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        if: steps.version.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "${TAG}" --verify-tag --generate-notes --title "${TAG}"
